# Only send "Connection: upgrade" when the client actually asked to upgrade.
# Hard-coding it on every /api request makes upstream treat ordinary API calls
# as an upgrade attempt and drop the keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy → the `api` service.
    #
    # The no-cache headers are repeated here because an `add_header` in a
    # location block REPLACES the inherited set — without repeating them this
    # location would lose the security headers set at the server level.
    #
    # Note there is deliberately no regex location for `.json`/`.html`: nginx
    # prefers a regex location over a prefix one, so a `location ~* \.json$`
    # would swallow `/api/openapi.json` and serve it as a static file from
    # disk instead of proxying it. The caching policy lives in the two
    # locations that actually need it.
    location /api {
        proxy_pass http://api:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support for real-time features
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # API responses are never cached — the data changes under the client.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Static assets with long-term caching. Vite fingerprints every file
    # name, so the URL changes whenever the content does.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The SPA. The HTML shell must never be cached, or a deploy is invisible
    # to anyone holding a stale copy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
