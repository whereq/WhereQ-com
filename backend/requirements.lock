# =============================================================================
# whereq.com — the resolved dependency tree
# =============================================================================
# Fully pinned, including every transitive dependency. This is what the
# Dockerfile, CI and the local setup install, so a stranger gets the same
# tree that was tested — not just the same direct dependencies.
#
# `requirements.txt` above it is the readable list of the DIRECT
# dependencies, with the reason each one is there. Read that one; install
# this one.
#
# Regenerate it after changing requirements.txt:
#
#   cd backend
#   python -m venv .venv
#   .venv/bin/pip install -r requirements.txt
#   .venv/bin/pip freeze --all \
#     | grep -v -E '^(pip|setuptools|wheel)==' \
#     | sort -f > requirements.lock
# =============================================================================

