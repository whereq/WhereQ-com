name: Feature request
description: Suggest something the app could do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to do. A feature is easier to argue for
        when the problem it solves is clear.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, in your own words. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - The map
        - Places and place cards
        - Schools
        - Hazards
        - Local content and the crawler
        - Fuel
        - Geography
        - The Maps data service
        - Authentication
        - Developer experience
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security issue.
          required: false
