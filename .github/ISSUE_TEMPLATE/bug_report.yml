name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more precise the
        reproduction, the faster it can be fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path from a fresh clone to the problem.
      render: shell
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: the git SHA, or the tag you are on

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - The map
        - Places and place cards
        - Schools
        - Hazards
        - Local content and the crawler
        - Fuel
        - Geography
        - The Maps data service
        - Authentication
        - The frontend build
        - The backend API
        - The Docker stack
        - Something else
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >
        Console output, a traceback, a screenshot. `docker compose logs` is
        usually the fastest way to get the useful part.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security issue.
          required: false
